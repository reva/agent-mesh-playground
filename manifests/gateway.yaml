apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
  labels: {app.kubernetes.io/part-of: agent-mesh-playground}
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: {from: All}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openrouter
  namespace: agentgateway-system
  labels: {app.kubernetes.io/part-of: agent-mesh-playground}
spec:
  ai:
    provider:
      openai:
        model: z-ai/glm-5.3
      host: openrouter.ai
      port: 443
      path: /api/v1/chat/completions
  policies:
    auth:
      secretRef:
        name: openrouter-api-key
    tls:
      sni: openrouter.ai
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openrouter
  namespace: agentgateway-system
  labels: {app.kubernetes.io/part-of: agent-mesh-playground}
spec:
  parentRefs:
    - name: agentgateway-proxy
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1}
      backendRefs:
        - name: openrouter
          group: agentgateway.dev
          kind: AgentgatewayBackend
